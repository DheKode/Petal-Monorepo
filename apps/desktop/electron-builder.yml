# Installer targets for P02 (#12). Builds are unsigned; disclose that in setup instructions.
appId: app.petal.desktop
productName: Petal
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch: x64
  artifactName: Petal-Setup-${version}-${arch}.${ext}
# The per-user install folder is named after the package name, which is scoped (@petal/desktop); give the installer a plain one.
extraMetadata:
  name: petal
nsis:
  # Do not start the app after install: that would open it on the real data folder before the user chose to.
  runAfterFinish: false
  # Per-user install, no administrator rights needed. Not signed: Windows SmartScreen will warn (see docs/desktop-install.md).
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: arm64
  # No Apple Developer ID, so sign ad hoc: a consistent signature lets macOS offer "Open Anyway" for the downloaded app
  # instead of reporting it as damaged. Hardened runtime only matters for notarization and would block the native modules.
  identity: '-'
  hardenedRuntime: false

# Native inference binaries must remain outside the asar; model weights are user-selected, not bundled.
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
  - node_modules/@libsql/**
