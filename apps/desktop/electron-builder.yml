# Installer targets for P02 (#12). Builds are unsigned; disclose that in setup instructions.
appId: app.petal.desktop
productName: Petal
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch: x64
  artifactName: Petal-Setup-${version}-${arch}.${ext}
nsis:
  # Per-user install, no administrator rights needed. Not signed: Windows SmartScreen will warn (see docs/desktop-install.md).
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: arm64

# Native inference binaries must remain outside the asar; model weights are user-selected, not bundled.
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
  - node_modules/@libsql/**
